<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAREERLIFT Admin</title>
  <link rel="icon" href="assets/logo.jpeg">
  <link rel="stylesheet" href="style.css">
  <style>
    body{min-height:100vh}
    .admin-wrap{max-width:1050px;margin:0 auto;padding:55px 6%}
    .admin-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
    .admin-panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px}
    .admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    .field label{font-size:12px;color:var(--muted);font-weight:700}
    .field input,.field textarea,.field select{width:100%;padding:13px 14px;background:#091512;border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none}
    .field textarea{min-height:120px;resize:vertical}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
    .admin-actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
    .message{font-size:13px;color:var(--muted)}
    .login-card{max-width:460px;margin:70px auto}
    .login-card h1{font-size:38px;letter-spacing:-2px;margin:10px 0 8px}
    .job-admin-list{display:grid;gap:12px;margin-top:18px}
    .admin-job{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:space-between;gap:15px}
    .admin-job h3{font-size:16px}.admin-job p{font-size:12px;color:var(--muted)}
    .danger{background:#5a1f28;color:#ffd9de;border:0}
    @media(max-width:700px){.admin-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.admin-head{display:block}.admin-head .hero-actions{margin-top:15px}}
  </style>
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html"><img src="assets/logo.jpeg" alt="CAREERLIFT"><span>CAREER<span class="brand-accent">LIFT</span></span></a>
    <a class="nav-telegram" href="index.html">← Public Website</a>
  </header>

  <main class="admin-wrap">
    <section id="loginView" class="admin-panel login-card">
      <span class="eyebrow">ADMIN ACCESS</span>
      <h1>CAREERLIFT Admin</h1>
      <p style="color:var(--muted);margin-bottom:22px">Sign in to publish a job. New posts appear on the public website automatically.</p>
      <form id="loginForm">
        <div class="field"><label>Email</label><input id="email" type="email" required placeholder="admin@example.com"></div>
        <div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password" required placeholder="Your password"></div>
        <div class="admin-actions"><button class="btn primary" type="submit">Sign in</button><span id="loginMsg" class="message"></span></div>
      </form>
    </section>

    <section id="dashboardView" hidden>
      <div class="admin-head">
        <div><span class="eyebrow">PUBLISH CENTER</span><h1 style="font-size:42px;letter-spacing:-2px;margin-top:8px">Post a new job.</h1><p style="color:var(--muted)">Publish once — it appears on the public page.</p></div>
        <div class="hero-actions"><button id="logoutBtn" class="btn secondary">Sign out</button><a class="btn primary" href="index.html">View site ↗</a></div>
      </div>

      <div class="admin-panel">
        <form id="jobForm" class="admin-grid">
          <div class="field"><label>Job title *</label><input id="title" required></div>
          <div class="field"><label>Company / Organization</label><input id="company"></div>
          <div class="field"><label>Category</label><select id="category"><option>Government Jobs</option><option>Private Jobs</option><option>IT Jobs</option><option>Freshers Jobs</option><option>Work From Home</option><option>Banking Jobs</option><option>Internships</option><option>Other</option></select></div>
          <div class="field"><label>Location</label><input id="location" placeholder="All India / Remote / Hyderabad"></div>
          <div class="field"><label>Qualification</label><input id="qualification"></div>
          <div class="field"><label>Experience</label><input id="experience"></div>
          <div class="field"><label>Salary</label><input id="salary"></div>
          <div class="field"><label>Last date</label><input id="last_date" placeholder="30 Oct 2026"></div>
          <div class="field full"><label>Official application URL *</label><input id="apply_url" type="url" required placeholder="https://example.com/apply"></div>
          <div class="field"><label>Telegram post URL</label><input id="telegram_url" type="url"></div>
          <div class="field"><label>WhatsApp post URL</label><input id="whatsapp_url" type="url"></div>
          <div class="field full"><label>Description</label><textarea id="description" placeholder="Eligibility, important dates, selection process, etc."></textarea></div>
          <div class="field full"><div class="admin-actions"><button class="btn primary" type="submit">Publish Job</button><button class="btn secondary" type="reset">Clear</button><span id="jobMsg" class="message"></span></div></div>
        </form>
      </div>

      <div class="admin-panel" style="margin-top:20px">
        <span class="eyebrow">RECENT POSTS</span>
        <div id="adminJobs" class="job-admin-list"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const client = (window.supabase && window.SUPABASE_URL && !window.SUPABASE_URL.includes("YOUR-PROJECT"))
      ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

    const $ = id => document.getElementById(id);
    const loginView = $("loginView"), dashboardView = $("dashboardView");

    function msg(el, text, error=false){ el.textContent=text; el.style.color=error ? "#ff9da8" : "var(--accent)"; }

    async function refreshSession(){
      if(!client){ msg($("loginMsg"), "Add your Supabase URL and anon key in supabase-config.js.", true); return; }
      const {data:{session}} = await client.auth.getSession();
      if(session){ loginView.hidden=true; dashboardView.hidden=false; loadAdminJobs(); }
    }

    $("loginForm").addEventListener("submit", async e=>{
      e.preventDefault();
      if(!client) return msg($("loginMsg"), "Supabase is not configured.", true);
      msg($("loginMsg"), "Signing in...");
      const {error} = await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});
      if(error) return msg($("loginMsg"), error.message, true);
      loginView.hidden=true; dashboardView.hidden=false; loadAdminJobs();
    });

    $("logoutBtn").addEventListener("click", async()=>{
      await client.auth.signOut(); dashboardView.hidden=true; loginView.hidden=false;
    });

    $("jobForm").addEventListener("submit", async e=>{
      e.preventDefault();
      msg($("jobMsg"), "Publishing...");
      const {data:{user}} = await client.auth.getUser();
      if(!user) return msg($("jobMsg"), "Please sign in again.", true);

      const payload = {
        title:$("title").value.trim(),
        company:$("company").value.trim(),
        category:$("category").value,
        location:$("location").value.trim(),
        qualification:$("qualification").value.trim(),
        experience:$("experience").value.trim(),
        salary:$("salary").value.trim(),
        last_date:$("last_date").value.trim(),
        apply_url:$("apply_url").value.trim(),
        telegram_url:$("telegram_url").value.trim() || null,
        whatsapp_url:$("whatsapp_url").value.trim() || null,
        description:$("description").value.trim(),
        created_by:user.id
      };

      const {error} = await client.from("jobs").insert(payload);
      if(error) return msg($("jobMsg"), error.message, true);

      msg($("jobMsg"), "Published successfully!");
      $("jobForm").reset();
      loadAdminJobs();
    });

    async function loadAdminJobs(){
      const {data, error} = await client.from("jobs").select("id,title,company,category,created_at").order("created_at",{ascending:false}).limit(20);
      if(error) return $("adminJobs").innerHTML = `<p class="message">${error.message}</p>`;
      $("adminJobs").innerHTML = data.map(job=>`
        <div class="admin-job">
          <div><h3>${escapeHtml(job.title)}</h3><p>${escapeHtml(job.company||"")} · ${escapeHtml(job.category||"")}</p></div>
          <button class="btn danger" onclick="deleteJob(${job.id})">Delete</button>
        </div>
      `).join("") || `<p class="message">No posts yet.</p>`;
    }

    async function deleteJob(id){
      if(!confirm("Delete this job?")) return;
      const {error} = await client.from("jobs").delete().eq("id",id);
      if(error) return alert(error.message);
      loadAdminJobs();
    }

    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

    refreshSession();
  </script>
</body>
</html>
